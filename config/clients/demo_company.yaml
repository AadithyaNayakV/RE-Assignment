client_id: demo_company
company_name: Demo Company
currency: USD
currency_symbol: $
units_scale: 1
source:
  type: excel
  filename: ABC Inc - Financial Statements.xlsx
sheets:
  income_statement:
    name: Income Statement
    header_row: 5
    label_columns:
    - A
    - B
    first_data_column: C
    last_data_column: T
    date_order: newest_first
    date_formats:
    - '%b %Y'
income_statement:
  sections:
  - key: revenue
    header_label: Income
    total_label: Total Income
  - key: cogs
    header_label: Cost of Goods Sold
    total_label: Total Cost of Goods Sold
  - key: opex
    header_label: Operating Expenses
    total_label: Total Operating Expenses
    subtotal_groups:
    - key: s_m_payroll
      name: S & M Payroll
      header_label: S & M Payroll
      total_label: Total S & M Payroll
    - key: marketing
      name: Marketing
      header_label: Marketing
      total_label: Total Marketing
  reported_lines:
    gross_profit: Gross Profit
    operating_income: Operating Income
    net_income: Net Income
opex_categories:
- name: Payroll & People Costs
  match_contains:
  - bonus
  - payroll
  - training
  - health insurance
  - workers comp
  - recruit
  - severance
- name: Commissions
  match_contains:
  - commission
- name: Contractors
  match_contains:
  - contractor
- name: Marketing & Advertising
  match_contains:
  - marketing
  - events
- name: Software, Hosting & AI
  match_contains:
  - software
  - ai token
- name: Professional & Legal Fees
  match_contains:
  - accounting
  - advisory
  - consult
  - legal
  - professional fees
- name: Occupancy & Insurance
  match_contains:
  - insurance
  - rent
- name: Travel, Meals & Office
  match_contains:
  - general expenses
  - meals
  - office
  - postage
  - printing
  - telephone
  - travel
- name: Finance, Tax & Non-Cash
  match_contains:
  - bad debt
  - bank
  - charities
  - depreciation
  - tax
  - interest
  - merchant fees
  - stock-based
fallback_opex_category: Uncategorised (needs review)
reconciliation:
  tolerance_abs: 0.01
  checks:
  - key: revenue_items_vs_total
    description: Sum of revenue line items equals the workbook's revenue total
  - key: cogs_items_vs_total
    description: Sum of COGS line items equals the workbook's COGS total
  - key: opex_items_vs_total
    description: Direct opex plus group subtotals equal the workbook's opex total
  - key: opex_group_subtotals
    description: Each subtotal group's members equal its own subtotal row
  - key: gross_profit
    description: Revenue total minus COGS total equals the reported gross profit
  - key: operating_income
    description: Gross profit minus opex total equals the reported operating income
classification_notes: []
thresholds:
  significant_mom_pct: 25.0
  significant_mom_abs: 10000.0
  significant_mom_min_abs: 1000.0
  oneoff_multiple: 3.0
  oneoff_min_abs: 5000.0
  oneoff_trailing_months: 6
  oneoff_window_min_abs: 25000.0
  top_movements: 5
ttm:
  months: 12
