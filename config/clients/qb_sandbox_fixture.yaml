# Golden case 19: the committed, scrubbed QuickBooks sandbox snapshot
# (tests/fixtures/qb_pl_monthly.json, Oct 2025 - Oct 2026). The same mapping as
# qb_sandbox.yaml (a test keeps them identical); only the client id, the name and the
# source location differ, so the eval never depends on a live pull or a git-ignored file.
#
#   python -m finance_engine report --client qb_sandbox_fixture --period 2026-09

client_id: qb_sandbox_fixture
company_name: QuickBooks Sandbox Company (SANDBOX fixture)
currency: USD
currency_symbol: $
units_scale: 1
synthetic: true
scenario: Intuit's QuickBooks Online sandbox sample company, read-only

source:
  type: quickbooks
  directory: tests/fixtures
  filename: qb_pl_monthly.json

# A snapshot read as a grid: row 1 holds the month headings, column A the labels and the
# months run oldest first from column B. Required by the config loader; the QuickBooks
# reader checks the snapshot against it.
sheets:
  income_statement:
    name: ProfitAndLoss
    header_row: 1
    label_columns: [A]
    first_data_column: B
    date_order: oldest_first

# Intuit's own report sections. Rows between a section's header and its total row belong
# to it; the label never decides. Other Income and Other Expenses (below Net Operating
# Income) are deliberately outside all three.
income_statement:
  sections:
    - key: revenue
      header_label: Income
      total_label: Total Income
    - key: cogs
      header_label: Cost of Goods Sold
      total_label: Total Cost of Goods Sold
    - key: opex
      header_label: Expenses
      total_label: Total Expenses
      subtotal_groups: []
  reported_lines:
    gross_profit: Gross Profit
    operating_income: Net Operating Income
    net_income: Net Income

# Presentation categories for the sandbox's expense accounts. First match wins. Labels of
# sub-accounts carry their path ("Job Expenses: Job Materials: Plants and Soil").
opex_categories:
  - name: Marketing & Advertising
    match_contains: [advertising]
  - name: Vehicles
    match_contains: [automobile, fuel]
  - name: Job Costs
    match_contains: ["job expenses"]
  - name: Professional & Legal Fees
    match_contains: ["legal & professional", accounting, bookkeeper, lawyer]
  - name: Repairs & Maintenance
    match_contains: ["maintenance and repair", repairs]
  - name: Occupancy, Utilities & Insurance
    match_contains: ["rent or lease", "equipment rental", utilities, insurance]
  - name: Travel, Meals & Office
    match_contains: [meals, office, travel]
fallback_opex_category: Other Operating Expenses

reconciliation:
  tolerance_abs: 0.01
  checks:
    - key: revenue_items_vs_total
      description: Sum of income accounts equals Intuit's Total Income
    - key: cogs_items_vs_total
      description: Sum of cost-of-goods-sold accounts equals Intuit's Total Cost of Goods Sold
    - key: opex_items_vs_total
      description: Sum of expense accounts equals Intuit's Total Expenses
    - key: gross_profit
      description: Total Income minus Total Cost of Goods Sold equals Intuit's Gross Profit
    - key: operating_income
      description: Gross Profit minus Total Expenses equals Intuit's Net Operating Income

classification_notes:
  - "QuickBooks Online SANDBOX data read through the direct read-only reader. Other Income
     and Other Expenses, which QuickBooks reports below Net Operating Income, are not folded
     into revenue or operating expenses: operating income is Intuit's Net Operating Income,
     and net income as reported is Intuit's Net Income, which includes them. QuickBooks
     leaves a cell blank when an account had no activity in a month and its own totals
     count that as zero; this reader does the same."

thresholds:
  significant_mom_pct: 25.0
  significant_mom_abs: 10000.0
  significant_mom_min_abs: 1000.0
  oneoff_multiple: 3.0
  oneoff_min_abs: 5000.0
  oneoff_trailing_months: 6
  oneoff_window_min_abs: 25000.0
  top_movements: 5
ttm:
  months: 12
