client_id: company_g_missing_data
company_name: Company G (SYNTHETIC)
currency: USD
currency_symbol: $
units_scale: 1
synthetic: true
scenario: two months absent from the workbook and one blank cell; oldest-first layout
source:
  type: excel
  filename: company_g_missing_data.xlsx
  directory: data/synthetic
sheets:
  income_statement:
    name: Income Statement
    header_row: 5
    label_columns:
    - A
    - B
    first_data_column: C
    date_order: oldest_first
    date_formats:
    - '%b %Y'
income_statement:
  sections:
  - key: revenue
    header_label: Income
    total_label: Total Income
  - key: cogs
    header_label: Cost of Goods Sold
    total_label: Total Cost of Goods Sold
  - key: opex
    header_label: Operating Expenses
    total_label: Total Operating Expenses
    subtotal_groups:
    - key: support_payroll
      name: Support Payroll
      header_label: Support Payroll
      total_label: Total Support Payroll
  reported_lines:
    gross_profit: Gross Profit
    operating_income: Operating Income
    net_income: Net Income
opex_categories:
- name: Payroll & People Costs
  match_contains:
  - payroll
  - bonus
  - benefits
  - workers comp
- name: Marketing & Advertising
  match_contains:
  - marketing/advertising
  - events & conferences
- name: Contractors
  match_contains:
  - contractor
- name: Software, Hosting & AI
  match_contains:
  - software
  - saas
  - hosting
- name: Professional & Legal Fees
  match_contains:
  - accounting
  - legal
  - consulting
  - settlement
- name: Occupancy & Insurance
  match_contains:
  - rent
  - insurance
- name: Travel, Meals & Office
  match_contains:
  - travel
  - meals
  - office
  - general expenses
- name: Finance, Tax & Non-Cash
  match_contains:
  - interest
  - depreciation
  - bad debts
  - tax
  - bank service
fallback_opex_category: Other Operating Expenses
reconciliation:
  tolerance_abs: 0.01
  checks:
  - key: revenue_items_vs_total
    description: Sum of revenue line items equals Total Income
  - key: cogs_items_vs_total
    description: Sum of COGS line items equals Total Cost of Goods Sold
  - key: opex_items_vs_total
    description: Direct opex plus group subtotals equal Total Operating Expenses
  - key: opex_group_subtotals
    description: Each subtotal group's members equal its subtotal row
  - key: gross_profit
    description: Total Income minus Total COGS equals Gross Profit
  - key: operating_income
    description: Gross Profit minus Total Operating Expenses equals Operating Income
  - key: balance_sheet_balances
    description: Total Assets equals Total Liabilities and Equity
classification_notes:
- SYNTHETIC test company (two months absent from the workbook and one blank cell;
  oldest-first layout). Generated by scripts/generate_synthetic.py. No figure here
  describes a real business.
thresholds:
  significant_mom_pct: 25.0
  significant_mom_abs: 10000.0
  significant_mom_min_abs: 1000.0
  oneoff_multiple: 3.0
  oneoff_min_abs: 5000.0
  oneoff_trailing_months: 6
  oneoff_window_min_abs: 25000.0
  top_movements: 5
ttm:
  months: 12
