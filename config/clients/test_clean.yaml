client_id: test_clean
company_name: Test Clean Co (SYNTHETIC)
currency: USD
currency_symbol: $
units_scale: 1
synthetic: true
scenario: small clean test file, no data problems
source:
  type: excel
  filename: test_clean.xlsx
  directory: data/clients/test_clean/source
sheets:
  income_statement:
    name: Income Statement
    header_row: 5
    label_columns:
    - A
    - B
    first_data_column: C
    date_order: newest_first
    date_formats:
    - '%b %Y'
income_statement:
  sections:
  - key: revenue
    header_label: Income
    total_label: Total Income
  - key: cogs
    header_label: Cost of Goods Sold
    total_label: Total Cost of Goods Sold
  - key: opex
    header_label: Operating Expenses
    total_label: Total Operating Expenses
    subtotal_groups: []
  reported_lines:
    gross_profit: Gross Profit
    operating_income: Operating Income
    net_income: Net Income
opex_categories:
- name: Payroll & People Costs
  match_contains:
  - payroll
- name: Marketing & Advertising
  match_contains:
  - marketing
- name: Software, Hosting & AI
  match_contains:
  - software
- name: Occupancy & Insurance
  match_contains:
  - rent
- name: Finance, Tax & Non-Cash
  match_contains:
  - bad debts
fallback_opex_category: Other Operating Expenses
reconciliation:
  tolerance_abs: 0.01
  checks:
  - key: revenue_items_vs_total
    description: Sum of revenue line items equals Total Income
  - key: cogs_items_vs_total
    description: Sum of COGS line items equals Total Cost of Goods Sold
  - key: opex_items_vs_total
    description: Direct opex plus group subtotals equal Total Operating Expenses
  - key: gross_profit
    description: Total Income minus Total COGS equals Gross Profit
  - key: operating_income
    description: Gross Profit minus Total Operating Expenses equals Operating Income
classification_notes:
- SYNTHETIC test company for manual testing. No figure here describes a real business.
thresholds:
  significant_mom_pct: 25.0
  significant_mom_abs: 10000.0
  significant_mom_min_abs: 1000.0
  oneoff_multiple: 3.0
  oneoff_min_abs: 5000.0
  oneoff_trailing_months: 6
  oneoff_window_min_abs: 25000.0
  top_movements: 5
ttm:
  months: 12